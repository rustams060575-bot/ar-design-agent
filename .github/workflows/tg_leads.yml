name: Telegram lead monitor

# Reads the chats from agent/tg_chats.json with a user account (Telethon) and sends Rustam a lead card with a reply draft.
# Each run lasts ~9 minutes and the next one starts right after, so messages are handled within seconds, around the clock.
# Private repositories have a monthly minutes quota: if this one is private, change the schedule to every 30 minutes.
on:
  schedule:
    - cron: "17 * * * *"      # hourly safety net; a finished run queues the next one itself (see the last step)
  workflow_dispatch:           # started by the bot ("найди заказы", /search) and by the daily Vercel cron
    inputs:
      discover:
        description: "true = search for new public chats right now and report a summary"
        type: string
        default: "true"
      query:
        description: "Optional topic, added to the chat search (e.g. react, telegram боты)"
        type: string
        default: ""

concurrency:
  group: tg-leads            # two runs never share one Telegram session
  cancel-in-progress: false

permissions:
  contents: read
  actions: write             # read: the monitor sees "join chat" requests (tg_join.yml runs); write: a finished run queues the next one

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Start clock
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements-monitor.txt

      - run: pip install -r agent/requirements-monitor.txt

      # Position in every chat (last message id) and hashes of handled texts survive between runs through the cache.
      - uses: actions/cache/restore@v4
        with:
          path: agent/tg_state.json
          key: tg-state-none
          restore-keys: tg-state-

      - name: Monitor chats
        run: python agent/tg_monitor.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TG_RUN_SECONDS: "540"
          TG_POLL_SECONDS: "120"     # public chats the account is not a member of are polled, read-only
          TG_FORCE_DISCOVER: ${{ inputs.discover }}
          TG_QUERY: ${{ inputs.query }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: agent/tg_state.json
          key: tg-state-${{ github.run_id }}

      # GitHub throttles a "*/10" schedule to a few runs a day, which left gaps. A run that lasted a normal stretch queues the next one
      # itself (the concurrency group makes it wait for this one to finish), so reading is continuous. A run that failed fast does not
      # chain: no tight loop, the schedule above and the alert to the owner take over.
      - name: Queue the next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          elapsed=$(( $(date +%s) - ${T0:-0} ))
          echo "run lasted ${elapsed}s"
          if [ "$elapsed" -ge 300 ]; then
            gh workflow run tg_leads.yml --repo "$GITHUB_REPOSITORY" -f discover=false || echo "could not queue the next run"
          fi
