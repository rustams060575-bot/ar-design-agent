name: Meta token check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tokens (read-only, token never printed)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys, json
          sys.path.insert(0, "agent")
          import meta_check as m
          V = m.V
          ig = os.environ.get("IG_USER_ID", "")
          for name in ("IG_ACCESS_TOKEN", "ACCESS_TOKEN", "FB_PAGE_TOKEN"):
              t = os.environ.get(name, "")
              print(f"\n===== {name}: {'set, len=' + str(len(t)) if t else 'EMPTY'}")
              if not t: continue
              print("graph.instagram.com/me:", m.get("https://graph.instagram.com/me", fields="user_id,username,account_type", access_token=t))
              s, d = m.get(f"https://graph.facebook.com/{V}/me", fields="id,name", access_token=t); print("fb /me:", s, d)
              if s == 200:
                  s2, d2 = m.get(f"https://graph.facebook.com/{V}/me/permissions", access_token=t)
                  if s2 == 200: print("granted:", sorted(p["permission"] for p in d2.get("data", []) if p.get("status") == "granted"))
                  s3, d3 = m.get(f"https://graph.facebook.com/{V}/me/accounts", fields="id,name,instagram_business_account{id,username}", access_token=t)
                  print("pages:", json.dumps(d3.get("data", d3) if s3 == 200 else d3, ensure_ascii=False))
              if ig:
                  print("ig account:", m.get(f"https://graph.facebook.com/{V}/{ig}", fields="id,username", access_token=t))
                  print("publish limit:", m.get(f"https://graph.facebook.com/{V}/{ig}/content_publishing_limit", fields="quota_usage,config", access_token=t))
          PY
